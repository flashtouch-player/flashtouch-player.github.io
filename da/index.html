<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSF2 + Ruffle</title>

<!-- Ruffle -->
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

h1{
    margin-bottom:15px;
}

#game-container{
    width:960px;
    height:540px;
    background:black;
    border:3px solid #444;
    overflow:hidden;
}

ruffle-player{
    width:100%;
    height:100%;
}

.info{
    margin-top:15px;
    opacity:0.8;
    text-align:center;
    line-height:1.5;
}
</style>
</head>

<body>

<h1>Super Smash Flash 2</h1>

<div id="game-container"></div>

<div class="info">
    Coloca aquí:<br>
    SSF2.swf y los archivos DAT/data del juego.
</div>

<script>
window.RufflePlayer = window.RufflePlayer || {};

window.addEventListener("load", () => {

    const ruffle = window.RufflePlayer.newest();

    const player = ruffle.createPlayer();

    document
        .getElementById("game-container")
        .appendChild(player);

    player.load({
        url: "SSF2.swf",

        autoplay: "on",
        unmuteOverlay: "hidden",
        backgroundColor: "#000000",

        // IMPORTANTE:
        allowNetworking: "all"
    });

});
</script>

</body>
</html>
